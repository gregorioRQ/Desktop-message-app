syntax = "proto3";

package com.pola;

option java_multiple_files = true;
option java_package = "com.pola.proto";
option java_outer_classname = "ImageMessageProto";

// ===== MENSAJES PARA WEBSOCKET (Notificación de imagen) =====

message ImageMessage {
    string media_id = 1;
    string sender_id = 2;
    string receiver_id = 3;
    string full_image_url = 4;
    int32 original_width = 5;
    int32 original_height = 6;
    int64 file_size = 7;
    int64 timestamp = 8;
    MessageStatus status = 9;
}

enum MessageStatus {
    SENT = 0;
    DELIVERED = 1;
    READ = 2;
    FAILED = 3;
}

// ===== MENSAJES DE CONTROL WEBSOCKET =====

message ImageAck {
    string media_id = 1;
    bool received = 2;
    int64 timestamp = 3;
}

message DeleteMediaRequest {
    string media_id = 1;
    string user_id = 2;
}

message DeleteMediaResponse {
    bool success = 1;
    string media_id = 2;
    string message = 3;
}
